<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Н4: подготовленные кромки</title>
  <desc id="desc">Собственная техническая схема DefectoSNG по геометрии ГОСТ 16037-80, таблица 23. Размеры показаны условными обозначениями; изображение не в масштабе.</desc>
  <defs>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="12" height="12" fill="#dbe5f2"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#7890aa" stroke-width="3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .metal{fill:url(#hatch);stroke:#172033;stroke-width:4;stroke-linejoin:round}
    .weld{fill:#f6b94c;stroke:#7c4700;stroke-width:4;stroke-linejoin:round}
    .backing{fill:#a8b7c9;stroke:#172033;stroke-width:4}
    .guide{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none}
    .dimension{stroke:#334155;stroke-width:2;fill:none}
    .label{font:600 20px Arial,sans-serif;fill:#243247}
    .heading{font:700 25px Arial,sans-serif;fill:#0f172a}
    .sub{font:17px Arial,sans-serif;fill:#526174}
  </style>
  <rect width="640" height="360" rx="18" fill="#ffffff"/>
  <text x="32" y="42" class="heading">Н4 · Подготовленные кромки</text>
  <text x="608" y="42" class="sub" text-anchor="end">ГОСТ 16037-80 · табл. 23</text>
  <g><path d="M60 190H580V250H60Z" class="metal"/><path d="M210 135H430V190H210Z" class="metal"/><line x1="320" y1="118" x2="320" y2="272" class="guide"/>
    <line x1="210" y1="105" x2="430" y2="105" class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="320" y="97" class="label" text-anchor="middle">l</text>
  
    <line x1="458" y1="135" x2="458" y2="190" class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="478" y="168" class="label" text-anchor="middle">s</text>
  </g>
  <text x="320" y="337" class="sub" text-anchor="middle">Нахлесточное соединение труб с муфтой; катет K выбирают по таблице 23.</text>
</svg>
