<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">С18: подготовленные кромки</title>
  <desc id="desc">Собственная техническая схема DefectoSNG по геометрии ГОСТ 16037-80, таблица 8. Размеры показаны условными обозначениями; изображение не в масштабе.</desc>
  <defs>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="12" height="12" fill="#dbe5f2"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#7890aa" stroke-width="3"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .metal{fill:url(#hatch);stroke:#172033;stroke-width:4;stroke-linejoin:round}
    .weld{fill:#f6b94c;stroke:#7c4700;stroke-width:4;stroke-linejoin:round}
    .backing{fill:#a8b7c9;stroke:#172033;stroke-width:4}
    .guide{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none}
    .dimension{stroke:#334155;stroke-width:2;fill:none}
    .label{font:600 20px Arial,sans-serif;fill:#243247}
    .heading{font:700 25px Arial,sans-serif;fill:#0f172a}
    .sub{font:17px Arial,sans-serif;fill:#526174}
  </style>
  <rect width="640" height="360" rx="18" fill="#ffffff"/>
  <text x="32" y="42" class="heading">С18 · Подготовленные кромки</text>
  <text x="608" y="42" class="sub" text-anchor="end">ГОСТ 16037-80 · табл. 8</text>
  <g><path d="M70 140H268L303 238H70Z" class="metal"/><path d="M372 140H570V238H337Z" class="metal"/><rect x="274" y="238" width="92" height="18" rx="3" class="backing"/>
    <line x1="303" y1="270" x2="337" y2="270" class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="320" y="262" class="label" text-anchor="middle">b</text>
  
    <line x1="270" y1="105" x2="320" y2="135" class="dimension" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="270" y="90" class="label" text-anchor="middle">30°</text>
  </g>
  <text x="320" y="337" class="sub" text-anchor="middle">Условная схема; фактические размеры выбирают по строке таблицы ГОСТ.</text>
</svg>
