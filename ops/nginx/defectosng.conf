server {
    server_name defecto-sng.ru www.defecto-sng.ru;
    root /var/www/DefectoSNG;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript application/manifest+json image/svg+xml text/css text/javascript text/plain;

    location = /family { return 301 /family/; }
    location ^~ /family/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 2m;
        proxy_read_timeout 30s;
    }

    location ^~ /game/ {
        alias /var/www/DefectoSNG/vova-game/;
        index index.html;
        try_files $uri $uri/ /game/index.html;
    }

    location ~ /\. { return 404; }
    location ~* ^/(?:docs|e2e|scripts|tests|node_modules|test-results|tmp)(?:/|$) { return 404; }
    location ~* \.(?:log|md|bak|backup|tmp|map)$ { return 404; }
    location ~* ^/(?:package(?:-lock)?\.json|playwright\.config\.mjs)$ { return 404; }

    location / {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/defecto-sng.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/defecto-sng.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.defecto-sng.ru) { return 301 https://$host$request_uri; } # managed by Certbot
    if ($host = defecto-sng.ru) { return 301 https://$host$request_uri; } # managed by Certbot
    listen 80;
    server_name defecto-sng.ru www.defecto-sng.ru;
    return 404; # managed by Certbot
}
