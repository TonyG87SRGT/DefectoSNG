<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">

  <title>DefectoSNG</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-mark">D</div>

      <div>
        <h1>DefectoSNG</h1>
        <p>Карманный справочник дефектоскописта</p>
      </div>
    </div>

    <div class="search-box">
      <span>⌕</span>

      <input
        id="search"
        type="search"
        placeholder="Поиск по справочнику..."
        autocomplete="off"
      >
    </div>
  </header>


  <main id="app-content"></main>


  <nav class="bottom-nav">

    <button class="nav-button active" data-action="home">
      <span>⌂</span>
      <small>Главная</small>
    </button>

    <button class="nav-button" data-action="search">
      <span>⌕</span>
      <small>Поиск</small>
    </button>

    <button class="nav-button" data-action="favorites">
      <span>☆</span>
      <small>Избранное</small>
    </button>

  </nav>

</div>

<script src="js/app.js"></script>

</body>
</html>
