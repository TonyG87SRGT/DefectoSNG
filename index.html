<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">

  <meta name="application-name" content="DefectoSNG">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DefectoSNG">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <title>DefectoSNG</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-mark">D</div>

      <div>
        <h1>DefectoSNG</h1>
        <p>Карманный справочник дефектоскописта</p>
      </div>
    </div>

    <div class="search-box">
      <span>⌕</span>

      <input
        id="search"
        type="search"
        aria-label="Поиск по справочнику"
        placeholder="Поиск по справочнику..."
        autocomplete="off"
      >
    </div>
  </header>


  <main id="app-content"></main>

</div>

<nav class="bottom-nav">

    <button class="nav-button active" data-action="home">
      <span aria-hidden="true">⌂</span>
      <small>Главная</small>
    </button>

    <button class="nav-button" data-action="search">
      <span aria-hidden="true">⌕</span>
      <small>Поиск</small>
    </button>

    <button class="nav-button" data-action="favorites">
      <span aria-hidden="true">☆ <b class="favorite-badge" id="favorite-badge"></b></span>
      <small>Избранное</small>
    </button>

</nav>

<script type="module" src="js/app.js"></script>

</body>
</html>
