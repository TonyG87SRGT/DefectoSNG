<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DefectoHelper</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

<h1>DefectoHelper</h1>
<p>Карманный справочник дефектоскописта</p>

<input
id="search"
type="text"
placeholder="🔍 Поиск по справочнику...">

</header>

<main>

<div class="cards">

<div class="card vik">
<h2>🔎 ВИК</h2>
<p>Визуальный и измерительный контроль</p>
</div>

<div class="card uzk">
<h2>📡 УЗК</h2>
<p>Ультразвуковой контроль</p>
</div>

<div class="card pvk">
<h2>🧪 ПВК</h2>
<p>Капиллярный контроль</p>
</div>

</div>

<h3>Быстрый доступ</h3>

<div class="quick">

<button>⭐ Избранное</button>

<button>🧮 Калькуляторы</button>

<button>📚 ГОСТы</button>

</div>

</main>

<script src="js/app.js"></script>

</body>
</html>
